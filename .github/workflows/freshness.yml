name: freshness

# Drift against upstream that no commit here causes: a new stable T3 Code
# release (and the harness catalog it would bring), a change to Claude Code's
# download channel or manifest (bin/install-claude-code), plus everything
# `pinned` and the share-link test check, and the other tool pins (gh, uv,
# Bun, the CI linters). A red run is the signal to bump; see
# scripts/freshness.ts and the "release sync" test for every pin. A scheduled
# run, or a manual one on main, also keeps one `freshness` issue open while
# it is red (scripts/freshness-issue.sh), so drift notifies instead of
# waiting for someone to open the Actions tab.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # The harness-catalog parser reads upstream with TypeScript's parser (a devDependency).
      - run: bun install --frozen-lockfile
      - name: Freshness (share link, pinned and newest T3 release, Claude Code downloads, tool pins)
        id: check
        run: |
          set +e
          bun scripts/freshness.ts all > report.txt 2>&1
          status=$?
          cat report.txt
          exit "$status"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Scheduled runs and manual runs on main: a manual run on a branch
      # just goes red, since it checks that branch's pins.
      - name: Track drift in the freshness issue
        if: >-
          always()
          && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
          && (steps.check.outcome == 'success' || steps.check.outcome == 'failure')
        run: scripts/freshness-issue.sh "$OUTCOME" report.txt "$RUN_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
