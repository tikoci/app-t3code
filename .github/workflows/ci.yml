name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      t3code_ver:
        description: "Upstream T3 Code version (stable only, no nightlies)"
        required: false
        default: "0.1.6"

permissions:
  contents: read
  packages: write

env:
  T3CODE_VER: ${{ github.event.inputs.t3code_ver || '0.1.6' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install
      - run: bun run check
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive stability tags
        id: tags
        run: |
          VER="${T3CODE_VER}"
          MINOR="${VER%.*}"
          MAJOR="${MINOR%.*}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
      - name: Build (PR) or push (main / dispatch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: T3CODE_VER=${{ steps.tags.outputs.ver }}
          tags: |
            ghcr.io/tikoci/app-t3code:${{ steps.tags.outputs.ver }}
            ghcr.io/tikoci/app-t3code:${{ steps.tags.outputs.minor }}
            ghcr.io/tikoci/app-t3code:${{ steps.tags.outputs.major }}
            ghcr.io/tikoci/app-t3code:latest
