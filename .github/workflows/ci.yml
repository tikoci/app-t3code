name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      t3code_ver:
        description: "Upstream T3 Code version (stable only, no nightlies)"
        required: false
        default: "0.1.6"

permissions:
  contents: read
  packages: write

env:
  T3CODE_VER: ${{ github.event.inputs.t3code_ver || '0.1.6' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install
      - run: bun run check
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    outputs:
      # The pushed manifest list: arm64 tests and promote retags exactly this,
      # even if another run (say, a dispatch with another T3CODE_VER at the
      # same commit) later moves :sha-<commit>.
      digest: ${{ steps.image.outputs.digest }}
      ver: ${{ steps.tags.outputs.ver }}
      minor: ${{ steps.tags.outputs.minor }}
      major: ${{ steps.tags.outputs.major }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive stability tags
        id: tags
        run: |
          VER="${T3CODE_VER}"
          MINOR="${VER%.*}"
          MAJOR="${MINOR%.*}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
      - name: Load native image for replacement test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: T3CODE_VER=${{ steps.tags.outputs.ver }}
          tags: app-t3code:test
      - name: Install test runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # Starts T3 with T3CODE_TOOL_GROUPS=all (waits for every payload to
      # install and runs the native group tools unprivileged), then with an
      # unknown group, then offline: dev, the native groups, the image default
      # (no --env) and none.
      - name: Test container replacement
        run: bun test test/container-replacement.test.ts
        env:
          APP_T3CODE_DOCKER_IMAGE: app-t3code:test
          APP_T3CODE_T3VER: ${{ steps.tags.outputs.ver }}
      # Main / dispatch push only the candidate tag. The release tags (the
      # /app YAML pins :0.1) move in `promote`, after the arm64 image has run
      # natively; PRs build both arches without pushing.
      - name: Build (PR) or push candidate (main / dispatch)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: T3CODE_VER=${{ steps.tags.outputs.ver }}
          tags: ghcr.io/tikoci/app-t3code:sha-${{ github.sha }}
      - name: Export inventories from the cached image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          target: inventory
          platforms: linux/amd64,linux/arm64
          build-args: T3CODE_VER=${{ steps.tags.outputs.ver }}
          outputs: type=local,dest=image-inventory
      - name: Record build identity
        env:
          BUILD_METADATA: ${{ steps.image.outputs.metadata }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s\n' "$BUILD_METADATA" > image-inventory/build-metadata.json
          printf '%s\n' "$IMAGE_DIGEST" > image-inventory/image-digest.txt
          printf '%s\n' "$GITHUB_SHA" > image-inventory/source-commit.txt
      - name: Record runtime tool-group status with every group selected
        run: |
          docker run --rm --network none --env T3CODE_TOOL_GROUPS=all \
            --entrypoint t3code-tools app-t3code:test status --json \
            > image-inventory/tool-groups-runtime-linux_amd64.json
          jq -e '(.selector.selected | length) == (.groups | length)' image-inventory/tool-groups-runtime-linux_amd64.json
          jq -r '.groups[] | "\(.name)\t\(.state)"' image-inventory/tool-groups-runtime-linux_amd64.json
      - name: Record actual GitHub runner packages
        run: bun scripts/runner-inventory.ts image-inventory/runner
      - name: Upload image package and tool inventories
        uses: actions/upload-artifact@v4
        with:
          name: image-inventory-${{ github.sha }}
          path: image-inventory/
          if-no-files-found: error
          retention-days: 90

  # The candidate's arm64 image on a native arm64 host: the same replacement
  # test as amd64 above (payload locks, extraction, wrappers, version probes,
  # flock), without QEMU user-mode. Not on PRs: it gates publication only.
  arm64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Pull the candidate by digest (arm64 variant)
        run: |
          test -n "${{ needs.build.outputs.digest }}" || { echo "::error::build pushed no digest"; exit 1; }
          docker pull --platform linux/arm64 "ghcr.io/tikoci/app-t3code@${{ needs.build.outputs.digest }}"
      - name: Test container replacement (native arm64)
        run: bun test test/container-replacement.test.ts
        env:
          APP_T3CODE_DOCKER_IMAGE: ghcr.io/tikoci/app-t3code@${{ needs.build.outputs.digest }}
          APP_T3CODE_T3VER: ${{ needs.build.outputs.ver }}
      - name: Record runtime tool-group status with every group selected (arm64)
        run: |
          docker run --rm --network none --env T3CODE_TOOL_GROUPS=all \
            --entrypoint t3code-tools "ghcr.io/tikoci/app-t3code@${{ needs.build.outputs.digest }}" status --json \
            > tool-groups-runtime-linux_arm64.json
          jq -e '(.selector.selected | length) == (.groups | length)' tool-groups-runtime-linux_arm64.json
          jq -r '.groups[] | "\(.name)\t\(.state)"' tool-groups-runtime-linux_arm64.json
      - uses: actions/upload-artifact@v4
        with:
          name: tool-groups-runtime-arm64-${{ github.sha }}
          path: tool-groups-runtime-linux_arm64.json
          retention-days: 90

  # Move the release tags onto the tested candidate, by digest (same
  # manifest list, no rebuild). main only: a dispatch on another branch stops at the tested
  # :sha-<commit> candidate (a pre-merge CHR test image). Serialized so an
  # older run never lands after a newer one.
  promote:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, arm64]
    concurrency:
      group: promote-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the candidate as the release
        run: |
          repo=ghcr.io/tikoci/app-t3code
          test -n "${{ needs.build.outputs.digest }}" || { echo "::error::build pushed no digest"; exit 1; }
          docker buildx imagetools create \
            -t "$repo:${{ needs.build.outputs.ver }}" \
            -t "$repo:${{ needs.build.outputs.minor }}" \
            -t "$repo:${{ needs.build.outputs.major }}" \
            -t "$repo:latest" \
            "$repo@${{ needs.build.outputs.digest }}"
          docker buildx imagetools inspect "$repo:${{ needs.build.outputs.minor }}"
