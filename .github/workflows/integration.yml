name: integration

# Full CHR proof: boot a real CHR per arch, install the /app from GHCR, and
# assert the T3 Code web UI answers. Slow (multi-GB downloads + a ~1GB
# image pull on a free-license CHR) — manual, weekly, and after each
# successful main publish. PRs rely on ci.yml (lint + offline YAML contract +
# image build).
#
# The YAML pins :0.1, so this must run after ci.yml has promoted the new
# image (workflow_run), not alongside it: a push trigger raced the ~14 minute
# build and tested the previous image.

on:
  workflow_dispatch:
    inputs:
      ros:
        description: "RouterOS version or channel for the CHR"
        required: false
        default: "stable"
      t3code_ver:
        description: "Expected T3 Code serverVersion"
        required: false
        default: "0.1.7"
  schedule:
    - cron: "37 4 * * 1"
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  chr:
    # After ci.yml: only when it succeeded on a push (so promote ran).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The commit ci.yml published, so the YAML and test match the image.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install QEMU
        run: sudo apt-get update -y && sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-efi-aarch64 qemu-utils socat
        if: matrix.arch == 'arm64'
      - name: Install QEMU (x86)
        run: sudo apt-get update -y && sudo apt-get install -y qemu-system-x86 qemu-utils socat
        if: matrix.arch == 'x86'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "::warning::no /dev/kvm — TCG fallback (slow)"
      - run: bun install
      - name: CHR app install + web UI probe
        run: APP_T3CODE_INTEGRATION=1 bun test test/integration/
        env:
          APP_T3CODE_ROS: ${{ github.event.inputs.ros || 'stable' }}
          APP_T3CODE_ARCH: ${{ matrix.arch }}
          APP_T3CODE_T3VER: ${{ github.event.inputs.t3code_ver || '0.1.7' }}
          APP_T3CODE_NAME: app-t3code-ci-${{ matrix.arch }}
          # After a publish: that commit's candidate, not :0.1 (a newer
          # promotion may have moved it). Weekly/manual runs test :0.1.
          APP_T3CODE_IMAGE: ${{ github.event_name == 'workflow_run' && format('ghcr.io/tikoci/app-t3code:sha-{0}', github.event.workflow_run.head_sha) || '' }}
