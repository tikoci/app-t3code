# yaml-language-server: $schema=https://tikoci.dev/restraml/routeros-app-yaml-schema.latest.json
# tikoci/app-t3code — RouterOS /app definition for the T3 Code server.
#
# Install on the router (production, HTTPS via /ip/cloud or your own domain):
#   /app/add yaml=<contents-of-this-file> use-https=yes
# On CHR (including tikoci/quickchr labs), use use-https=no instead.
#
# Image tags track upstream T3 Code stable releases only (no nightlies):
# ghcr.io/tikoci/app-t3code:<T3CODE_VER> with :0.1 / :0 / :latest as
# stability aliases. Pin the full version in production; :0.1 follows
# patch releases.

name: t3code
descr: T3 Code server — agentic coding in the browser (GHCR build for RouterOS)
page: https://github.com/tikoci/app-t3code
category: development
url-path: /
services:
  t3code:
    image: ghcr.io/tikoci/app-t3code:0.1
    ports:
      - "3773:3773:web:tcp"
    environment:
      HOME: /data
      T3CODE_HOME: /data/.t3
      T3CODE_HOST: 0.0.0.0
      T3CODE_PORT: "3773"
      T3CODE_TELEMETRY_ENABLED: "false"
      # Optional tool groups, installed into /data in the background after
      # start. Remove names to skip them; "none" is core only. On an installed
      # app change this with /app/set environment= (README), never yaml=.
      T3CODE_TOOL_GROUPS: "capture labs vpn routing dev"
      # Provider CLIs to install into /data in the background: claude codex
      # cursor grok opencode antigravity pi muse, or "none". Same rules.
      T3CODE_PROVIDERS: "claude codex"
    volumes:
      # Keep this name and destination when upgrading: the whole home,
      # including .t3/userdata, projects, worktrees, and provider logins.
      - t3code-data:/data
    restart: unless-stopped
volumes:
  t3code-data: {}
