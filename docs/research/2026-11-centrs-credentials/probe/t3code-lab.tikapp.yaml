# Lab copy of app/t3code.tikapp.yaml for the credentials research: adds an
# app-level secret (as a file only, no env placeholder) and one address
# placeholder. Core tools only, Codex only, to keep the pull and install small.
name: t3code
descr: T3 Code server (credentials lab)
category: development
url-path: /
services:
  t3code:
    image: ghcr.io/tikoci/app-t3code:0.1
    ports:
      - "3773:3773:web:tcp"
    environment:
      HOME: /data
      T3CODE_HOME: /data/.t3
      T3CODE_HOST: 0.0.0.0
      T3CODE_PORT: "3773"
      T3CODE_TELEMETRY_ENABLED: "false"
      T3APP_TOOL_GROUPS: "none"
      T3APP_PROVIDERS: "codex"
      T3APP_SKILLS: "tikoci/routeros-skills"
      LAB_ROUTER: "[networkRouterIP]"
    secrets:
      - routeros_pw
    volumes:
      - t3code-data:/data
    restart: unless-stopped
secrets:
  routeros_pw:
volumes:
  t3code-data: {}
